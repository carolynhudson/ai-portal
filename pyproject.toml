[project]
name = "ai-portal"
version = "0.1.0"
description = "AI Tool Management Web Portal — manage llama.cpp, ComfyUI, and Hugging Face on this box"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "gguf>=0.10",
    "huggingface_hub>=0.26",
]

[project.scripts]
ai-portal = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
