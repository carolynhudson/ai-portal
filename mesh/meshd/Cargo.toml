[package]
name = "meshd"
version = "0.3.5"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
nvml-wrapper = "0.13.0"
reqwest = { version = "0.13.5", features = ["rustls", "blocking", "json"] }
rmcp = { version = "3.9.0", features = ["transport-streamable-http-server", "server-side-http", "transport-worker", "tower", "transport-streamable-http-server-session", "client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
