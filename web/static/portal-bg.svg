<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- HALO page tile (strengthened 2x, ceiling 0.16): distant halos (alpha only, palette-native), amber spark at center. Tiles at 256px.
       The corner halo is drawn at ALL FOUR corners: a circle centered on one
       corner renders only its in-tile quadrant, and the other quadrants fall
       off the tile - one corner copy tiles as quarter-arcs that never close
       (owner, 2026-10-31: "a clipped circle in one corner that isn't
       mirrored"). Four corner copies make the four quadrants meet at each
       tiling junction and close into a full circle. fill="none" is explicit:
       an unspecified fill defaults to BLACK (tests/test_page_background.py). -->
  <g>
    <circle cx="128" cy="128" r="58" fill="none" stroke="#5aa9ff" stroke-width="1.4" opacity="0.11"/>
    <circle cx="128" cy="128" r="74" fill="none" stroke="#bc8cff" stroke-width="1.0" opacity="0.07"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#5aa9ff" stroke-width="1.4" opacity="0.1"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#bc8cff" stroke-width="1.0" opacity="0.06"/>
    <circle cx="256" cy="0" r="46" fill="none" stroke="#5aa9ff" stroke-width="1.4" opacity="0.1"/>
    <circle cx="256" cy="0" r="60" fill="none" stroke="#bc8cff" stroke-width="1.0" opacity="0.06"/>
    <circle cx="0" cy="256" r="46" fill="none" stroke="#5aa9ff" stroke-width="1.4" opacity="0.1"/>
    <circle cx="0" cy="256" r="60" fill="none" stroke="#bc8cff" stroke-width="1.0" opacity="0.06"/>
    <circle cx="256" cy="256" r="46" fill="none" stroke="#5aa9ff" stroke-width="1.4" opacity="0.1"/>
    <circle cx="256" cy="256" r="60" fill="none" stroke="#bc8cff" stroke-width="1.0" opacity="0.06"/>
    <circle cx="128" cy="128" r="1.6" fill="#d29922" opacity="0.09"/>
  </g>
</svg>
