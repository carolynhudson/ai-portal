<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <!-- size zero + absolute: an inlined svg with no dimensions is a
       300x150 block in the flow -- it shipped an invisible inch above
       the nav (owner, 2026-11-03). Symbols/defs render from a
       zero-box exactly as from a visible one. -->
<!-- The nav icon sprite (INLINED into base.html by Jinja -- never served;
     the gradients must live in the SAME document as the use references) -->
  <!-- (owner-approved set, 2026-11-03, PORTAL_PLAN 6.14.1ze).
     Palette law: the mark's blue->violet gradient is the base voice for every
     icon; colors outside the mark enter SPARINGLY, small area, only where they
     mean something (ok-green in Health, amber on the workbench/llama voices);
     red is never a nav icon. Icons carry no words; the words live in the nav
     links (and aria-labels), never inside the glyphs. -->
<defs>
<linearGradient id="hv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa9ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
<linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#5aa9ff"/></linearGradient>
</defs>
