<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · AI Portal</title>
<style>
:root{--bg:#0e1116;--panel:#171c24;--fg:#e6e9ef;--mut:#8b95a7;--acc:#5aa9ff;--bad:#f85149;--line:#232a35}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);
     display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;width:340px}
h1{font-size:18px;margin:0 0 4px}
p{color:var(--mut);margin:0 0 16px;font-size:14px}
input[type=password]{width:100%;padding:10px;border-radius:8px;border:1px solid #2a3340;background:#0b0e13;color:var(--fg)}
button{width:100%;margin-top:12px;padding:11px;border-radius:8px;border:0;background:var(--acc);color:#04121f;font-weight:600;cursor:pointer}
.err{color:var(--bad);margin-top:10px;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>AI Portal</h1>
  <p>Enter the portal password to continue.</p>
  <form method="post" action="/login">
    <input type="password" name="password" autofocus autocomplete="current-password" placeholder="password">
    <button type="submit">Sign in</button>
  </form>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</div>
</body>
</html>
